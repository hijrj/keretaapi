<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login UI</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.login-container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    padding: 40px 35px;
    box-shadow: 0 20px 50px rgba(0,0,0,.15);
}

.logo {
    width: 70px;
    height: 70px;
    margin: auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color: white;
    font-size: 30px;
    font-weight: bold;
}

h1 {
    text-align: center;
    margin-top: 20px;
    color: #222;
}

.subtitle {
    text-align: center;
    color: #777;
    margin: 10px 0 30px;
    font-size: 14px;
}

.input-group {
    margin-bottom: 18px;
}

label {
    display:block;
    margin-bottom:8px;
    color:#444;
    font-size:14px;
}

input {
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid #ddd;
    outline:none;
    transition:.3s;
    font-size:15px;
}

input:focus {
    border-color:#667eea;
    box-shadow:0 0 0 3px rgba(102,126,234,.15);
}

.options {
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    margin-bottom:25px;
}

.options a {
    color:#667eea;
    text-decoration:none;
}

button {
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover {
    transform:translateY(-2px);
    opacity:.9;
}

.register {
    text-align:center;
    margin-top:25px;
    font-size:14px;
    color:#666;
}

.register a {
    color:#667eea;
    font-weight:bold;
    text-decoration:none;
}

@media(max-width:480px){
    .card{
        padding:30px 22px;
    }
}
</style>
</head>

<body>

<div class="login-container">
    <div class="card">

        <div class="logo">L</div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Silakan login untuk masuk ke akun Anda</p>

        <form>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Masukkan email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Masukkan password">
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" style="width:auto"> Ingat saya
                </label>
                <a href="#">Lupa password?</a>
            </div>

            <button type="submit">Login</button>

            <div class="register">
                Belum punya akun? <a href="#">Daftar sekarang</a>
            </div>
        </form>

    </div>
</div>

</body>
</html>
